name: Build KeyKite desktop apps

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6.16,<7" "pillow>=11,<13"
      - name: Test imports and password strength
        run: python -m unittest test_importing test_strength -v
      - name: Build KeyKite.exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --icon keykite.png --name KeyKite app.py
      - name: Verify KeyKite.exe opens its window
        shell: pwsh
        run: |
          $env:XDG_CONFIG_HOME = Join-Path $env:RUNNER_TEMP 'keykite-smoke-config'
          $env:XDG_DATA_HOME = Join-Path $env:RUNNER_TEMP 'keykite-smoke-data'
          $taskProcess = Start-Process -FilePath (Resolve-Path 'dist/KeyKite.exe') -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(45)
            $opened = $false
            do {
              Start-Sleep -Milliseconds 500
              $taskProcess.Refresh()
              if ($taskProcess.HasExited) {
                throw "KeyKite.exe exited before opening its window (code $($taskProcess.ExitCode))."
              }
              # PyInstaller one-file apps open their window in a child process.
              $windows = @(Get-Process -Name KeyKite -ErrorAction SilentlyContinue |
                Where-Object { $_.MainWindowTitle -eq 'KeyKite' })
              if ($windows.Count -gt 0) {
                $opened = $true
                Write-Host 'KeyKite.exe opened the KeyKite window successfully.'
                break
              }
            } while ((Get-Date) -lt $deadline)
            if (-not $opened) {
              Get-Process -Name KeyKite -ErrorAction SilentlyContinue |
                Select-Object Id, MainWindowTitle | Format-Table | Out-String | Write-Host
              throw 'KeyKite.exe did not open the KeyKite window within 45 seconds.'
            }
          } finally {
            Get-Process -Name KeyKite -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue
          }
      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: KeyKite-Windows-x64
          path: dist/KeyKite.exe
          if-no-files-found: error

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6.16,<7" "pillow>=11,<13"
      - name: Test storage, imports, cloud, and password strength
        run: python -m unittest test_vault test_importing test_cloud test_strength -v
      - name: Build KeyKite.app
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --icon keykite.png --name KeyKite --osx-bundle-identifier io.github.danny19862025.keykite app.py
      - name: Archive app with executable permissions
        run: ditto -c -k --sequesterRsrc --keepParent dist/KeyKite.app dist/KeyKite-macOS-arm64.zip
      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: KeyKite-macOS-arm64
          path: dist/KeyKite-macOS-arm64.zip
          if-no-files-found: error
